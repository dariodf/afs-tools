<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AFS Listen — cannon haptics via microphone</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="listen-body listen-body-cannons">
    <main class="listen-cannons-stage" id="listen-stage" data-state="ready">
      <div class="listen-cannons-canvas">
        <video
          id="cannon-video"
          class="listen-cannons-video"
          playsinline
          preload="auto"
        ></video>
        <div class="listen-cannons-flash" id="cannon-flash"></div>
      </div>

      <div class="listen-cannons-overlay">
        <header class="listen-header">
          <div class="listen-source-title" id="listen-source-title">
            AFS Listen · cannons
          </div>
          <div class="listen-status" id="listen-status">tap to listen</div>
        </header>

        <button class="listen-start" id="listen-start" type="button">
          <span class="listen-start-mic" aria-hidden="true">●</span>
          <span class="listen-start-label">Start listening</span>
          <span class="listen-start-hint">Uses your microphone</span>
        </button>

        <footer class="listen-foot">
          <canvas
            class="listen-waveform"
            id="listen-waveform"
            width="800"
            height="80"
            aria-hidden="true"
          ></canvas>
        </footer>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "smol-toml": "./vendor/smol-toml/index.js",
          "@unimusic/chromaprint/dist/chromaprint.js": "./vendor/@unimusic/chromaprint/chromaprint.js"
        }
      }
    </script>
    <script type="module" src="src/listen-cannons.js"></script>
  </body>
</html>
