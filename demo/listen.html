<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AFS Listen — subtitles via microphone</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="listen-body">
    <main class="listen-stage" id="listen-stage" data-state="ready">
      <header class="listen-header">
        <div class="listen-source-title" id="listen-source-title">
          AFS Listen
        </div>
        <div class="listen-status" id="listen-status"></div>
      </header>

      <!--
        Pick-files panel: shown when listen.html is opened without
        afs= / srt= URL parameters. Lets the user load locally-stored
        files from their device (the canonical "I generated my own
        AFS, now I want to use it" path). Hidden once the user picks
        files or when URL params are present.
      -->
      <section class="listen-pick" id="listen-pick" hidden>
        <h2 class="listen-pick-heading">Load your own files</h2>
        <p class="listen-pick-lede">
          Generated an AFS on
          <a href="generate.html">generate.html</a>?
          Pick it here along with your subtitle file to listen.
        </p>
        <label class="listen-pick-field">
          <span>AFS file</span>
          <input type="file" id="listen-pick-afs" accept=".afs,text/plain" />
        </label>
        <label class="listen-pick-field">
          <span>Subtitle file</span>
          <input type="file" id="listen-pick-srt" accept=".srt,.vtt,text/plain" />
        </label>
        <p class="listen-pick-status" id="listen-pick-status"></p>
      </section>

      <div class="listen-subtitle" id="listen-subtitle">
        <span class="listen-subtitle-text" id="listen-subtitle-text"></span>
      </div>

      <button class="listen-start" id="listen-start" type="button">
        <span class="listen-start-mic" aria-hidden="true">●</span>
        <span class="listen-start-label">Tap to start listening</span>
        <span class="listen-start-hint">Listens to the audio through your microphone</span>
      </button>

      <footer class="listen-foot">
        <canvas
          class="listen-waveform"
          id="listen-waveform"
          width="800"
          height="80"
          aria-hidden="true"
        ></canvas>
        <a class="listen-foot-link" href="index.html">AFS project</a>
      </footer>
    </main>

    <script type="importmap">
      {
        "imports": {
          "smol-toml": "./vendor/smol-toml/index.js",
          "@unimusic/chromaprint/dist/chromaprint.js": "./vendor/@unimusic/chromaprint/chromaprint.js"
        }
      }
    </script>
    <script type="module" src="src/listen.js"></script>
  </body>
</html>
